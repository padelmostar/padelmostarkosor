name: Supabase Keep-Alive

# Pings the Supabase database twice a week so the free-tier project
# never pauses after 7 days of inactivity (which breaks bookings).

on:
  schedule:
    # Runs Mondays and Thursdays at 08:00 UTC. The ~3-day gap stays
    # comfortably inside Supabase's 7-day inactivity window.
    - cron: '0 8 * * 1,4'
  workflow_dispatch:   # lets you run it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the bookings table
        run: |
          # The anon key is already public (it's in the site's index.html),
          # so it's safe to keep here. This hits PostgREST -> Postgres,
          # which counts as real database activity.
          URL="https://wzxgvupaqwkqlrohgfkh.supabase.co/rest/v1/bookings?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6eGd2dXBhcXdrcWxyb2hnZmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzkyODYsImV4cCI6MjA5MzQxNTI4Nn0.cWO6zX6KuNDW1SOxAupI-vC3conFTvOSDoVwSJze6Bo"
          echo "Pinging Supabase..."
          curl -fsS "$URL" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "Keep-alive ping succeeded."
